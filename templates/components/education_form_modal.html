<div id="education-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="education-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="education-modal"
            popovertargetaction="hide"
            aria-label="Close the education form"></button>
    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="education-modal"
                popovertargetaction="hide"
                aria-label="Close the education form">×</button>
        <h2 id="education-modal-title">Add Education</h2>
        <form id="education-form" class="education-form">
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    <p class="form-error" id="{{ field.id_for_label }}-error" hidden></p>
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="education-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button" id="education-form-submit">Add Education</button>
            </div>
        </form>
    </div>
</div>
